name: Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt
        
    - name: Run Pytest with Coverage Gate
      run: |
        cd backend
        pytest --cov=app --cov-report=xml --cov-fail-under=72

    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/coverage.xml

  mastra-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: mastra-service/package.json
        
    - name: Install dependencies
      run: |
        cd mastra-service
        npm install
        
    - name: Run Mastra test suite
      run: |
        cd mastra-service
        npm test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm install
        
    - name: Run Frontend unit tests
      run: |
        cd frontend
        npm test

    - name: Build Next.js app
      run: |
        cd frontend
        npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        pip install -r backend/requirements.txt -r backend/requirements-dev.txt
        cd frontend
        npm install
        npx playwright install chromium --with-deps

    - name: Run Backend Server in Background
      run: |
        cd backend
        python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        sleep 5

    - name: Run Frontend Server in Background
      run: |
        cd frontend
        npm run dev &
        sleep 10

    - name: Run Playwright E2E Tests
      run: |
        cd frontend
        npx playwright test


